[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kdenlive-commentor"
version = "1.0.0"
description = "Sync Kdenlive episode notes into the Samkväm session Markdown file"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "seetee" }]

[project.urls]
Repository = "https://github.com/seetee/kdenlive-commentor"

[project.scripts]
kdenlive-commentor = "kdenlive_commentor:main"

[tool.setuptools]
py-modules = ["kdenlive_commentor"]

[tool.ruff]
line-length = 100
